name: Synthetic recovery
on:
  workflow_dispatch:
    inputs:
      version:
        description: Synthetic release version
        required: true
        type: choice
        options: [v1, v2]
      attest:
        description: Generate public provenance for the receipt
        type: boolean
        default: false
permissions: {}
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: recover
        env:
          VERSION: ${{ inputs.version }}
        run: python3 -B colector.py "$GITHUB_REPOSITORY" "$VERSION" "$GITHUB_SHA" evidence
      - if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/receipt.json
            evidence/release.json
            evidence/asset.json
          retention-days: 3
          if-no-files-found: error
      - if: failure() && steps.recover.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/diagnostic.json
          retention-days: 3
          if-no-files-found: ignore
  attest:
    needs: collect
    if: inputs.attest
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      attestations: write
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - id: sign
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: evidence/receipt.json
          create-storage-record: false
      - env:
          BUNDLE: ${{ steps.sign.outputs.bundle-path }}
        run: cp -- "$BUNDLE" bundle.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: bundle.json
          retention-days: 3
